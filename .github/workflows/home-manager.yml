name: home-manager

on:
  push:
    paths:
      - '.github/workflows/home-manager.yml'
      - 'home-manager/**'
  pull_request:
    paths:
      - '.github/workflows/home-manager.yml'
      - 'home-manager/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  home-manager:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: home-manager (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - run: make install-home-manager
        working-directory: home-manager
      - run: make build
        working-directory: home-manager
