name: home-manager

on:
  push:
    paths:
      - '.github/workflows/home-manager.yml'
      - 'home-manager/**'
  pull_request:
    paths:
      - '.github/workflows/home-manager.yml'
      - 'home-manager/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  home-manager:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: home-manager (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - run: make install-home-manager
        working-directory: home-manager
      - run: make build
        working-directory: home-manager
