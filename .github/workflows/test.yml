name: test

on:
  - push
  - pull_request

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-and-test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: deploy & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rm -f "$HOME"/.bash{_logout,_profile,rc} "$HOME"/.docker/config.json "$HOME"/.gitconfig "$HOME"/.profile
      - run: make deploy
      - run: make test
      - run: test "$(make test)" = 'done.'
  shellcheck:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find-scripts
        run: echo "files=$(find bash git/hooks -type f | sort | tr '\n' ' ')" | tee -a "$GITHUB_OUTPUT"
      - uses: docker://koalaman/shellcheck:stable@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d
        with:
          args: ${{ steps.find-scripts.outputs.files }}
